services:
  - type: web
    name: verifychain
    runtime: python
    region: oregon             # free plan only runs in Oregon (US West)
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python app.py

    envVars:
      - key: NO_BROWSER
        value: "1"
      - key: RENDER
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.4"
